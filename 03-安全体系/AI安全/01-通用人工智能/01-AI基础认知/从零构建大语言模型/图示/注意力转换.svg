<svg xmlns="http://www.w3.org/2000/svg" width="320" height="475" viewBox="0 0 320 475" role="img" aria-labelledby="title desc">
<title id="title">输入向量分别产生 Q、K、V</title>
<desc id="desc">同一位置的输入向量分别乘以三组可训练参数，得到用于寻找、匹配和传递的向量，再经过注意力计算形成上下文表示。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<rect width="320" height="475" rx="12" fill="#fff"/>
<g font-family="system-ui, -apple-system, sans-serif">
<rect x="18" y="18" width="284" height="71" rx="8" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="47" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">同一位置的输入向量 x</text>
<text x="160.0" y="72" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">例如“它”当前位置的表示</text>
<path d="M160 90 V112 H62 V135 M160 112 V135 M160 112 H258 V135" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="144" width="88" height="117" rx="8" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="62.0" y="173" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">Q：寻找</text>
<text x="62.0" y="198" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">x × W_Q</text>
<text x="62.0" y="221" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">与可见位置</text>
<text x="62.0" y="244" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">的 K 比较</text>
<rect x="116" y="144" width="88" height="117" rx="8" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="173" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">K：匹配</text>
<text x="160.0" y="198" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">x × W_K</text>
<text x="160.0" y="221" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">供各位置的</text>
<text x="160.0" y="244" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">Q 进行比较</text>
<rect x="214" y="144" width="88" height="117" rx="8" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="258.0" y="173" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">V：传递</text>
<text x="258.0" y="198" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">x × W_V</text>
<text x="258.0" y="221" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">提供实际</text>
<text x="258.0" y="244" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">混合的内容</text>
<path d="M62 262 V286 H160 V319 M160 262 V286 M258 262 V286 H160" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M160 286 V319" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="329" width="284" height="94" rx="8" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="358" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">为当前位置形成上下文表示</text>
<text x="160.0" y="383" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">Q·K → 缩放与遮罩 → softmax</text>
<text x="160.0" y="406" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">再按权重混合可见位置的 V</text>
<text x="160" y="454" font-size="12" text-anchor="middle" font-weight="normal" fill="#242424">三组转换参数在各位置间共享</text>
</g>
</svg>
