<svg xmlns="http://www.w3.org/2000/svg" width="320" height="470" viewBox="0 0 320 470" role="img" aria-labelledby="title desc">
<title id="title">文字到 GPT 输入的数据流</title>
<desc id="desc">Hello, do you 经 GPT-2 分词得到四个 ID；输入与目标错开一位，一个输入样本变为形状为 1、3、768 的向量表示。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<rect width="320" height="470" rx="12" fill="#fff"/>
<g font-family="system-ui, -apple-system, sans-serif">
<rect x="18" y="12" width="284" height="54" rx="7" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="34" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">文字</text>
<text x="160.0" y="55" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">Hello, do you</text>
<path d="M160 68 V77" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="84" width="284" height="74" rx="7" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="106" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">切分与编号</text>
<text x="160.0" y="127" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">Hello → 15496；逗号 → 11</text>
<text x="160.0" y="147" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">␠do → 466；␠you → 345</text>
<path d="M160 160 V169" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="176" width="284" height="74" rx="7" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="198" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">输入与目标错开一位</text>
<text x="160.0" y="219" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">输入：[15496, 11, 466]</text>
<text x="160.0" y="239" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">目标：[11, 466, 345]</text>
<path d="M160 252 V261" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="268" width="284" height="74" rx="7" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="290" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">一个输入样本放进 batch</text>
<text x="160.0" y="311" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">[[15496, 11, 466]]</text>
<text x="160.0" y="331" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">形状：(1, 3)</text>
<path d="M160 344 V353" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="360" width="284" height="74" rx="7" fill="#f6f6f3" stroke="#b8b8b0"/>
<text x="160.0" y="382" font-size="14" text-anchor="middle" font-weight="600" fill="#242424">查 token 表，加位置向量</text>
<text x="160.0" y="403" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">输入表示形状：(1, 3, 768)</text>
<text x="160.0" y="423" font-size="13" text-anchor="middle" font-weight="normal" fill="#242424">目标仍是 ID，用于计算损失</text>
<text x="160" y="456" font-size="12" text-anchor="middle" font-weight="normal" fill="#242424">␠ 表示 token 中包含的空格</text>
</g>
</svg>
